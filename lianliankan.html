<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>连连看小游戏 - 带连接路径</title>
    <style>
        :root {
            --cell-size: 60px;
            --cell-font-size: 28px;
            --gap: 4px;
            --board-padding: 10px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            padding: 10px;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 580px;
        }

        .game-header {
            margin-bottom: 12px;
        }

        .game-title {
            font-size: clamp(22px, 5vw, 32px);
            color: #667eea;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 14px;
            padding: 10px 14px;
            background: #f0f0f0;
            border-radius: 10px;
        }

        .score,
        .timer,
        .remaining-display {
            font-size: clamp(13px, 3.2vw, 18px);
            color: #333;
            font-weight: bold;
            white-space: nowrap;
        }

        .score span,
        .timer span,
        .remaining-display span {
            color: #667eea;
        }

        /* 棋盘外层需要相对定位，以便 canvas 绝对定位覆盖 */
        .board-wrapper {
            position: relative;
            display: inline-block;
            margin: 10px auto;
            line-height: 0;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(8, var(--cell-size));
            grid-template-rows: repeat(8, var(--cell-size));
            gap: var(--gap);
            padding: var(--board-padding);
            background: #e0e0e0;
            border-radius: 10px;
            position: relative;
            z-index: 1;
            line-height: normal;
        }

        /* 连接线画布层 */
        .path-canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 10;
        }

        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--cell-font-size);
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
            background: #fff;
            border: 2px solid #ddd;
            user-select: none;
            -webkit-user-select: none;
            line-height: 1;
        }

        .cell:active {
            transform: scale(0.95);
            transition: transform 0.1s ease;
        }

        .cell.selected {
            border: 3px solid #667eea;
            background: #e8eaff;
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .cell.matched {
            animation: matchAnimation 0.3s ease forwards;
        }

        .cell.empty {
            background: #f9f9f9;
            border: 2px dashed #ddd;
            cursor: default;
            pointer-events: none;
        }

        .cell.empty:hover {
            transform: none;
            box-shadow: none;
        }

        @keyframes matchAnimation {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.2);
                opacity: 0.8;
                background: #ffd700;
            }
            100% {
                transform: scale(0);
                opacity: 0;
            }
        }

        .button {
            padding: 10px 20px;
            font-size: clamp(13px, 3vw, 16px);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            margin: 4px;
            font-weight: bold;
            transition: all 0.3s ease;
            color: white;
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
        }

        .button:active {
            transform: scale(0.94);
            transition: transform 0.1s ease;
        }

        .btn-start {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-hint {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .btn-hint:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.4);
        }

        .btn-shuffle {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .btn-shuffle:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 172, 254, 0.4);
        }

        .game-message {
            margin-top: 14px;
            font-size: clamp(14px, 3.5vw, 20px);
            color: #667eea;
            font-weight: bold;
            min-height: 26px;
            transition: all 0.3s ease;
        }

        /* 胜利弹窗样式 */
        .game-over-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
            padding: 20px;
        }

        .game-over-dialog {
            background: white;
            border-radius: 20px;
            padding: clamp(24px, 5vw, 40px);
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.5s ease;
            max-width: 400px;
            width: 100%;
        }

        .game-over-dialog .success-icon {
            font-size: clamp(40px, 10vw, 60px);
            margin-bottom: 16px;
        }

        .game-over-dialog h2 {
            font-size: clamp(20px, 5vw, 28px);
            color: #667eea;
            margin-bottom: 16px;
        }

        .game-over-dialog .stats {
            background: #f8f9ff;
            border-radius: 10px;
            padding: clamp(14px, 3vw, 20px);
            margin: 16px 0;
        }

        .game-over-dialog .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px 0;
            font-size: clamp(14px, 3.5vw, 18px);
            color: #333;
            flex-wrap: wrap;
            gap: 4px;
        }

        .game-over-dialog .stat-label {
            color: #666;
        }

        .game-over-dialog .stat-value {
            font-weight: bold;
            color: #667eea;
            font-size: clamp(16px, 4vw, 20px);
        }

        .game-over-dialog button {
            padding: 12px 36px;
            font-size: clamp(15px, 3.5vw, 18px);
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            margin-top: 8px;
            -webkit-tap-highlight-color: transparent;
        }

        .game-over-dialog button:active {
            transform: scale(0.94);
        }

        .game-over-dialog button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideIn {
            from {
                transform: translateY(-40px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* 移动端额外适配 */
        @media (max-width: 480px) {
            .game-container {
                padding: 14px 10px;
                border-radius: 14px;
            }

            .game-info {
                padding: 8px 10px;
                gap: 6px;
                border-radius: 8px;
            }

            .button {
                padding: 8px 16px;
                margin: 3px;
                border-radius: 20px;
            }

            .board-wrapper {
                margin: 6px auto;
            }

            .game-board {
                border-radius: 8px;
            }

            .cell {
                border-radius: 6px;
                border-width: 1.5px;
            }

            .cell.selected {
                border-width: 2.5px;
            }

            .game-message {
                margin-top: 10px;
                min-height: 22px;
            }
        }

        @media (max-width: 360px) {
            .game-container {
                padding: 10px 6px;
                border-radius: 10px;
            }

            .game-info {
                padding: 6px 8px;
                gap: 4px;
                border-radius: 6px;
            }

            .button {
                padding: 7px 12px;
                margin: 2px;
                font-size: 12px;
                border-radius: 16px;
            }

            .board-wrapper {
                margin: 4px auto;
            }
        }

        /* 横屏手机适配 */
        @media (max-height: 500px) and (orientation: landscape) {
            body {
                padding: 4px;
            }

            .game-container {
                padding: 8px 14px;
                border-radius: 12px;
            }

            .game-header {
                margin-bottom: 4px;
            }

            .game-title {
                font-size: 18px;
                margin-bottom: 2px;
            }

            .game-info {
                margin-bottom: 6px;
                padding: 6px 10px;
                gap: 4px;
            }

            .board-wrapper {
                margin: 4px auto;
            }

            .game-message {
                margin-top: 6px;
                min-height: 18px;
                font-size: 13px;
            }

            .button {
                padding: 6px 14px;
                margin: 2px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1 class="game-title">🎮 连连看</h1>
        </div>

        <div class="game-info">
            <div class="score">得分: <span id="score">0</span></div>
            <div class="timer">时间: <span id="timer">0</span>秒</div>
            <div class="remaining-display">剩余: <span id="remaining">0</span></div>
        </div>

        <!-- 棋盘外层包裹器，方便叠加 canvas -->
        <div class="board-wrapper" id="boardWrapper">
            <div class="game-board" id="gameBoard"></div>
            <canvas class="path-canvas" id="pathCanvas"></canvas>
        </div>

        <div>
            <button class="button btn-start" onclick="startGame()">🔄 新游戏</button>
            <button class="button btn-hint" onclick="showHint()">💡 提示</button>
            <button class="button btn-shuffle" onclick="shuffleBoard()">🔀 重排</button>
        </div>

        <div class="game-message" id="message"></div>
    </div>

    <script>
        class LianLianKan {
            constructor() {
                this.board = [];
                this.selectedCell = null;
                this.score = 0;
                this.timer = 0;
                this.timerInterval = null;
                this.rows = 8;
                this.cols = 8;
                this.icons = ['🍎', '🍊', '🍋', '🍇', '🍓', '🍒', '🥝', '🍑',
                    '🌸', '🌺', '🌻', '🌹', '🍀', '🌴', '🌵', '⭐'
                ];
                this.gameFinished = false;

                // 画布相关
                this.canvas = document.getElementById('pathCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.pathTimer = null;
                this.canvasCssWidth = 0;
                this.canvasCssHeight = 0;
                this.dpr = 1;

                // 动态尺寸（在 calculateCellSize 中计算）
                this.cellSize = 60;
                this.gap = 4;
                this.boardPadding = 10;
                this.cellFontSize = 28;

                // resize 防抖
                this.resizeDebounceTimer = null;
                this._boundResizeHandler = this._handleResize.bind(this);

                this.init();
            }

            init() {
                this.calculateCellSize();
                this.createBoard();
                this.renderBoard();
                this.setupEventListeners();
                this.resizeCanvas();
                // 监听窗口大小变化
                window.addEventListener('resize', this._boundResizeHandler);
                window.addEventListener('orientationchange', () => {
                    // orientationchange 后延迟执行，等待布局更新
                    clearTimeout(this.resizeDebounceTimer);
                    this.resizeDebounceTimer = setTimeout(() => this._handleResize(), 300);
                });
            }

            // 清理资源（在重新开始游戏时调用）
            destroy() {
                window.removeEventListener('resize', this._boundResizeHandler);
                window.removeEventListener('orientationchange', () => {});
                clearTimeout(this.resizeDebounceTimer);
                this.stopTimer();
                this.clearPath();
            }

            _handleResize() {
                clearTimeout(this.resizeDebounceTimer);
                this.resizeDebounceTimer = setTimeout(() => {
                    if (this.gameFinished) return;
                    const oldSelected = this.selectedCell ? {
                        row: this.selectedCell.row,
                        col: this.selectedCell.col
                    } : null;
                    this.deselectCell();
                    this.clearPath();
                    this.calculateCellSize();
                    this.renderBoard();
                    this.resizeCanvas();
                    // 尝试恢复选中状态
                    if (oldSelected && this.board[oldSelected.row][oldSelected.col] !== null) {
                        const cells = document.querySelectorAll('.cell');
                        const cellEl = cells[oldSelected.row * this.cols + oldSelected.col];
                        if (cellEl && !cellEl.classList.contains('empty')) {
                            this.selectCell(oldSelected.row, oldSelected.col, cellEl);
                        }
                    }
                }, 250);
            }

            // 动态计算格子大小
            calculateCellSize() {
                const maxCellSize = 60;
                const minCellSize = 26;

                // 可用宽度（考虑 container padding 和 wrapper 边距）
                const containerPadding = window.innerWidth <= 360 ? 24 :
                    window.innerWidth <= 480 ? 34 : 50;
                const availableWidth = window.innerWidth - containerPadding;

                // 可用高度（减去非棋盘内容）
                const nonBoardHeight = window.innerHeight <= 500 ? 160 : 240;
                const availableHeight = window.innerHeight - nonBoardHeight;

                // 基于宽度计算（预留 padding 和 gap 的空间）
                const cellSizeFromWidth = Math.floor((availableWidth - 20) / this.cols);
                const cellSizeFromHeight = Math.floor((availableHeight - 20) / this.rows);

                let cellSize = Math.min(cellSizeFromWidth, cellSizeFromHeight, maxCellSize);
                cellSize = Math.max(cellSize, minCellSize);

                this.cellSize = cellSize;
                this.gap = Math.max(2, Math.min(4, Math.round(cellSize * 0.07)));
                this.boardPadding = Math.max(5, Math.min(10, Math.round(cellSize * 0.18)));
                this.cellFontSize = Math.max(14, Math.round(cellSize * 0.48));
            }

            // 调整 canvas 尺寸以匹配棋盘实际大小，处理设备像素比
            resizeCanvas() {
                const gameBoard = document.getElementById('gameBoard');
                const cssWidth = gameBoard.offsetWidth;
                const cssHeight = gameBoard.offsetHeight;

                if (cssWidth === 0 || cssHeight === 0) {
                    // DOM 尚未就绪，稍后重试
                    requestAnimationFrame(() => this.resizeCanvas());
                    return;
                }

                this.canvasCssWidth = cssWidth;
                this.canvasCssHeight = cssHeight;
                this.dpr = window.devicePixelRatio || 1;

                // 设置 canvas 物理像素尺寸
                this.canvas.width = cssWidth * this.dpr;
                this.canvas.height = cssHeight * this.dpr;

                // 设置 canvas CSS 显示尺寸
                this.canvas.style.width = cssWidth + 'px';
                this.canvas.style.height = cssHeight + 'px';

                // 缩放坐标系统，使绘制使用 CSS 像素
                this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
            }

            // 获取某个格子中心的像素坐标（相对于 canvas，使用 CSS 像素）
            getCellCenter(row, col) {
                const x = this.boardPadding + col * (this.cellSize + this.gap) + this.cellSize / 2;
                const y = this.boardPadding + row * (this.cellSize + this.gap) + this.cellSize / 2;
                return { x, y };
            }

            // 获取连接路径的像素坐标数组（拐点）
            getConnectionPath(row1, col1, row2, col2) {
                const points = [];
                points.push(this.getCellCenter(row1, col1));

                // 直线连接
                if (row1 === row2) {
                    points.push(this.getCellCenter(row2, col2));
                    return points;
                }
                if (col1 === col2) {
                    points.push(this.getCellCenter(row2, col2));
                    return points;
                }

                // 检查单拐点
                const corner1 = { row: row1, col: col2 };
                const corner2 = { row: row2, col: col1 };

                if (this.board[corner1.row][corner1.col] === null &&
                    this.canConnectDirect(row1, col1, corner1.row, corner1.col) &&
                    this.canConnectDirect(corner1.row, corner1.col, row2, col2)) {
                    points.push(this.getCellCenter(corner1.row, corner1.col));
                    points.push(this.getCellCenter(row2, col2));
                    return points;
                }

                if (this.board[corner2.row][corner2.col] === null &&
                    this.canConnectDirect(row1, col1, corner2.row, corner2.col) &&
                    this.canConnectDirect(corner2.row, corner2.col, row2, col2)) {
                    points.push(this.getCellCenter(corner2.row, corner2.col));
                    points.push(this.getCellCenter(row2, col2));
                    return points;
                }

                // 双拐点（横向扫描）
                for (let col = 0; col < this.cols; col++) {
                    if (col === col1 || col === col2) continue;
                    if (this.board[row1][col] === null && this.board[row2][col] === null &&
                        this.canConnectDirect(row1, col1, row1, col) &&
                        this.canConnectDirect(row1, col, row2, col) &&
                        this.canConnectDirect(row2, col, row2, col2)) {
                        points.push(this.getCellCenter(row1, col));
                        points.push(this.getCellCenter(row2, col));
                        points.push(this.getCellCenter(row2, col2));
                        return points;
                    }
                }

                // 双拐点（纵向扫描）
                for (let row = 0; row < this.rows; row++) {
                    if (row === row1 || row === row2) continue;
                    if (this.board[row][col1] === null && this.board[row][col2] === null &&
                        this.canConnectDirect(row1, col1, row, col1) &&
                        this.canConnectDirect(row, col1, row, col2) &&
                        this.canConnectDirect(row, col2, row2, col2)) {
                        points.push(this.getCellCenter(row, col1));
                        points.push(this.getCellCenter(row, col2));
                        points.push(this.getCellCenter(row2, col2));
                        return points;
                    }
                }

                return points;
            }

            // 绘制路径（使用 CSS 像素坐标）
            drawPath(points) {
                if (!points || points.length < 2) return;
                this.ctx.clearRect(0, 0, this.canvasCssWidth, this.canvasCssHeight);
                this.ctx.beginPath();
                this.ctx.strokeStyle = '#ff5722';
                this.ctx.lineWidth = Math.max(2.5, Math.min(5, this.cellSize * 0.07));
                this.ctx.lineCap = 'round';
                this.ctx.lineJoin = 'round';
                this.ctx.shadowColor = 'rgba(255, 87, 34, 0.6)';
                this.ctx.shadowBlur = Math.max(4, Math.min(8, this.cellSize * 0.12));

                this.ctx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) {
                    this.ctx.lineTo(points[i].x, points[i].y);
                }
                this.ctx.stroke();
                // 重置阴影
                this.ctx.shadowBlur = 0;
                this.ctx.shadowColor = 'transparent';
            }

            // 清除画布
            clearPath() {
                this.ctx.clearRect(0, 0, this.canvasCssWidth, this.canvasCssHeight);
                if (this.pathTimer) {
                    clearTimeout(this.pathTimer);
                    this.pathTimer = null;
                }
            }

            createBoard() {
                let icons = [];
                for (let i = 0; i < 16; i++) {
                    for (let j = 0; j < 4; j++) {
                        icons.push(this.icons[i]);
                    }
                }
                icons = this.shuffleArray(icons);
                this.board = [];
                for (let i = 0; i < this.rows; i++) {
                    this.board[i] = [];
                    for (let j = 0; j < this.cols; j++) {
                        this.board[i][j] = icons[i * this.cols + j];
                    }
                }
            }

            shuffleArray(array) {
                const arr = [...array];
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            renderBoard() {
                const gameBoard = document.getElementById('gameBoard');
                // 设置 CSS 变量
                gameBoard.style.setProperty('--cell-size', `${this.cellSize}px`);
                gameBoard.style.setProperty('--cell-font-size', `${this.cellFontSize}px`);
                gameBoard.style.setProperty('--gap', `${this.gap}px`);
                gameBoard.style.setProperty('--board-padding', `${this.boardPadding}px`);
                gameBoard.style.gridTemplateColumns = `repeat(${this.cols}, ${this.cellSize}px)`;
                gameBoard.style.gridTemplateRows = `repeat(${this.rows}, ${this.cellSize}px)`;
                gameBoard.style.gap = `${this.gap}px`;
                gameBoard.style.padding = `${this.boardPadding}px`;

                gameBoard.innerHTML = '';
                for (let i = 0; i < this.rows; i++) {
                    for (let j = 0; j < this.cols; j++) {
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        cell.dataset.row = i;
                        cell.dataset.col = j;
                        if (this.board[i][j]) {
                            cell.textContent = this.board[i][j];
                        } else {
                            cell.classList.add('empty');
                        }
                        gameBoard.appendChild(cell);
                    }
                }
                document.getElementById('remaining').textContent = this.countRemaining();
                // 重新渲染后更新画布尺寸
                this.resizeCanvas();
            }

            setupEventListeners() {
                const gameBoard = document.getElementById('gameBoard');
                // 移除旧监听器（通过替换元素实现，无需额外处理）
                gameBoard.addEventListener('click', (e) => {
                    if (this.gameFinished) return;
                    const cell = e.target.closest('.cell');
                    if (!cell || cell.classList.contains('empty') || cell.classList.contains('matched')) {
                        return;
                    }
                    const row = parseInt(cell.dataset.row);
                    const col = parseInt(cell.dataset.col);
                    this.handleCellClick(row, col, cell);
                });

                // 触摸事件（移动端优化，防止双击缩放等问题）
                gameBoard.addEventListener('touchend', (e) => {
                    // click 事件在移动端也会触发，这里不做额外处理
                    // 但可以用于未来扩展（如长按等）
                });
            }

            handleCellClick(row, col, cellElement) {
                if (this.selectedCell) {
                    if (this.selectedCell.row === row && this.selectedCell.col === col) {
                        this.deselectCell();
                        return;
                    }
                    if (this.canConnect(this.selectedCell.row, this.selectedCell.col, row, col)) {
                        // 先绘制路径
                        const path = this.getConnectionPath(this.selectedCell.row, this.selectedCell.col, row, col);
                        this.drawPath(path);

                        // 匹配成功，延迟后消除
                        const r1 = this.selectedCell.row;
                        const c1 = this.selectedCell.col;
                        const r2 = row;
                        const c2 = col;
                        this.deselectCell(); // 立即取消选中样式
                        // 禁用点击（防止消除动画期间再次点击）
                        this.gameFinished = true; // 临时禁止操作
                        setTimeout(() => {
                            this.gameFinished = false;
                            this.clearPath();
                            this.matchCells(r1, c1, r2, c2);
                        }, 300);
                    } else {
                        this.deselectCell();
                        this.selectCell(row, col, cellElement);
                    }
                } else {
                    this.selectCell(row, col, cellElement);
                }
            }

            selectCell(row, col, cellElement) {
                this.selectedCell = { row, col, element: cellElement };
                cellElement.classList.add('selected');
            }

            deselectCell() {
                if (this.selectedCell && this.selectedCell.element) {
                    this.selectedCell.element.classList.remove('selected');
                }
                this.selectedCell = null;
            }

            matchCells(row1, col1, row2, col2) {
                const cells = document.querySelectorAll('#gameBoard .cell');
                const cell1 = cells[row1 * this.cols + col1];
                const cell2 = cells[row2 * this.cols + col2];

                if (!cell1 || !cell2) {
                    // 元素已不存在（可能在动画期间被 resize 重建），直接更新数据
                    this.board[row1][col1] = null;
                    this.board[row2][col2] = null;
                    this.renderBoard();
                    this.score += 10;
                    document.getElementById('score').textContent = this.score;
                    document.getElementById('message').textContent = '匹配成功！+10分';
                    const remaining = this.countRemaining();
                    if (remaining === 0) {
                        this.gameWin();
                    }
                    return;
                }

                cell1.classList.add('matched');
                cell2.classList.add('matched');

                setTimeout(() => {
                    this.board[row1][col1] = null;
                    this.board[row2][col2] = null;
                    this.renderBoard();
                    this.score += 10;
                    document.getElementById('score').textContent = this.score;
                    document.getElementById('message').textContent = '匹配成功！+10分';
                    const remaining = this.countRemaining();
                    if (remaining === 0) {
                        this.gameWin();
                    }
                }, 300);
            }

            canConnect(row1, col1, row2, col2) {
                if (row1 < 0 || row1 >= this.rows || col1 < 0 || col1 >= this.cols ||
                    row2 < 0 || row2 >= this.rows || col2 < 0 || col2 >= this.cols) return false;
                if (this.board[row1][col1] !== this.board[row2][col2]) return false;
                if (this.board[row1][col1] === null || this.board[row2][col2] === null) return false;
                if (row1 === row2 && col1 === col2) return false;
                return this.canConnectDirect(row1, col1, row2, col2) ||
                    this.canConnectOneCorner(row1, col1, row2, col2) ||
                    this.canConnectTwoCorners(row1, col1, row2, col2);
            }

            canConnectDirect(row1, col1, row2, col2) {
                if (row1 === row2) {
                    let minCol = Math.min(col1, col2);
                    let maxCol = Math.max(col1, col2);
                    for (let col = minCol + 1; col < maxCol; col++) {
                        if (this.board[row1][col] !== null) return false;
                    }
                    return true;
                }
                if (col1 === col2) {
                    let minRow = Math.min(row1, row2);
                    let maxRow = Math.max(row1, row2);
                    for (let row = minRow + 1; row < maxRow; row++) {
                        if (this.board[row][col1] !== null) return false;
                    }
                    return true;
                }
                return false;
            }

            canConnectOneCorner(row1, col1, row2, col2) {
                let corner1 = { row: row1, col: col2 };
                let corner2 = { row: row2, col: col1 };
                if (this.board[corner1.row][corner1.col] === null) {
                    if (this.canConnectDirect(row1, col1, corner1.row, corner1.col) &&
                        this.canConnectDirect(corner1.row, corner1.col, row2, col2)) {
                        return true;
                    }
                }
                if (this.board[corner2.row][corner2.col] === null) {
                    if (this.canConnectDirect(row1, col1, corner2.row, corner2.col) &&
                        this.canConnectDirect(corner2.row, corner2.col, row2, col2)) {
                        return true;
                    }
                }
                return false;
            }

            canConnectTwoCorners(row1, col1, row2, col2) {
                for (let col = 0; col < this.cols; col++) {
                    if (col === col1 || col === col2) continue;
                    if (this.board[row1][col] === null && this.board[row2][col] === null) {
                        if (this.canConnectDirect(row1, col1, row1, col) &&
                            this.canConnectDirect(row1, col, row2, col) &&
                            this.canConnectDirect(row2, col, row2, col2)) {
                            return true;
                        }
                    }
                }
                for (let row = 0; row < this.rows; row++) {
                    if (row === row1 || row === row2) continue;
                    if (this.board[row][col1] === null && this.board[row][col2] === null) {
                        if (this.canConnectDirect(row1, col1, row, col1) &&
                            this.canConnectDirect(row, col1, row, col2) &&
                            this.canConnectDirect(row, col2, row2, col2)) {
                            return true;
                        }
                    }
                }
                return false;
            }

            countRemaining() {
                let count = 0;
                for (let i = 0; i < this.rows; i++) {
                    for (let j = 0; j < this.cols; j++) {
                        if (this.board[i][j] !== null) count++;
                    }
                }
                return count;
            }

            findHint() {
                for (let i = 0; i < this.rows; i++) {
                    for (let j = 0; j < this.cols; j++) {
                        if (this.board[i][j] === null) continue;
                        for (let k = 0; k < this.rows; k++) {
                            for (let l = 0; l < this.cols; l++) {
                                if (i === k && j === l) continue;
                                if (this.board[k][l] === null) continue;
                                if (this.canConnect(i, j, k, l)) {
                                    return { row1: i, col1: j, row2: k, col2: l };
                                }
                            }
                        }
                    }
                }
                return null;
            }

            startTimer() {
                this.stopTimer();
                this.timer = 0;
                document.getElementById('timer').textContent = this.timer;
                this.timerInterval = setInterval(() => {
                    this.timer++;
                    document.getElementById('timer').textContent = this.timer;
                }, 1000);
            }

            stopTimer() {
                if (this.timerInterval) {
                    clearInterval(this.timerInterval);
                    this.timerInterval = null;
                }
            }

            gameWin() {
                this.gameFinished = true;
                this.stopTimer();

                // 计算最终得分：消除得分 - 用时秒数（不低于0）
                const finalScore = Math.max(0, this.score - this.timer);

                let stars = '';
                let starCount = 0;
                if (this.timer <= 60) {
                    starCount = 3;
                    stars = '⭐⭐⭐';
                } else if (this.timer <= 120) {
                    starCount = 2;
                    stars = '⭐⭐';
                } else {
                    starCount = 1;
                    stars = '⭐';
                }

                const overlay = document.createElement('div');
                overlay.className = 'game-over-overlay';
                const dialog = document.createElement('div');
                dialog.className = 'game-over-dialog';
                dialog.innerHTML = `
                    <div class="success-icon">🎉</div>
                    <h2>恭喜通关！</h2>
                    <div class="stats">
                        <div class="stat-item">
                            <span class="stat-label">⏱️ 所用时间</span>
                            <span class="stat-value">${this.timer} 秒</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">🎯 消除得分</span>
                            <span class="stat-value">${this.score} 分</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">🏆 最终得分</span>
                            <span class="stat-value" style="color: #e91e63;">${finalScore} 分</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">⭐ 评价</span>
                            <span class="stat-value">${stars}</span>
                        </div>
                    </div>
                    <p style="color: #666; margin-bottom: 15px; font-size: clamp(13px, 3vw, 16px);">
                        最终得分 = 消除得分 - 所用时间<br>
                        ${starCount === 3 ? '太棒了！你是连连看大师！' :
                          starCount === 2 ? '不错哦！继续加油！' :
                          '完成了！试试更快一点吧！'}
                    </p>
                    <button onclick="startGame()">🔄 再玩一次</button>
                `;
                document.body.appendChild(overlay);
                document.body.appendChild(dialog);
                overlay.addEventListener('click', function(e) {
                    if (e.target === overlay) {
                        overlay.remove();
                        dialog.remove();
                    }
                });
                // 也支持触摸关闭
                overlay.addEventListener('touchend', function(e) {
                    if (e.target === overlay) {
                        overlay.remove();
                        dialog.remove();
                    }
                });
                document.getElementById('message').textContent = '太棒了！全部消除完毕！';
            }
        }

        // 全局函数
        let game;

        function startGame() {
            // 清理旧游戏
            if (game) {
                game.destroy();
                game = null;
            }
            // 移除弹窗
            document.querySelectorAll('.game-over-overlay, .game-over-dialog').forEach(el => el.remove());
            // 创建新游戏
            game = new LianLianKan();
            game.startTimer();
            document.getElementById('score').textContent = '0';
            document.getElementById('message').textContent = '';
        }

        function showHint() {
            if (!game || game.gameFinished) return;
            const hint = game.findHint();
            if (hint) {
                const cells = document.querySelectorAll('#gameBoard .cell');
                const cell1 = cells[hint.row1 * game.cols + hint.col1];
                const cell2 = cells[hint.row2 * game.cols + hint.col2];
                if (cell1 && cell2) {
                    cell1.style.background = '#ffd700';
                    cell2.style.background = '#ffd700';

                    // 绘制提示连接路径
                    const path = game.getConnectionPath(hint.row1, hint.col1, hint.row2, hint.col2);
                    game.drawPath(path);

                    // 清除之前的定时器
                    if (game.pathTimer) clearTimeout(game.pathTimer);
                    game.pathTimer = setTimeout(() => {
                        if (cell1) cell1.style.background = '';
                        if (cell2) cell2.style.background = '';
                        game.clearPath();
                        game.pathTimer = null;
                    }, 1200);
                }
                document.getElementById('message').textContent = '找到可匹配的对了！';
            } else {
                document.getElementById('message').textContent = '没有可匹配的了，请重排！';
            }
        }

        function shuffleBoard() {
            if (!game || game.gameFinished) return;
            let icons = [];
            for (let i = 0; i < game.rows; i++) {
                for (let j = 0; j < game.cols; j++) {
                    if (game.board[i][j] !== null) {
                        icons.push(game.board[i][j]);
                    }
                }
            }
            icons = game.shuffleArray(icons);
            let index = 0;
            for (let i = 0; i < game.rows; i++) {
                for (let j = 0; j < game.cols; j++) {
                    if (game.board[i][j] !== null) {
                        game.board[i][j] = icons[index++];
                    }
                }
            }
            game.deselectCell();
            game.clearPath();
            if (game.pathTimer) {
                clearTimeout(game.pathTimer);
                game.pathTimer = null;
            }
            game.renderBoard();
            document.getElementById('message').textContent = '棋盘已重新排列！';
        }

        // 页面加载完成后启动游戏
        window.addEventListener('DOMContentLoaded', () => {
            // 确保初始布局稳定后再启动
            setTimeout(startGame, 100);
        });
    </script>
