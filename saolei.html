<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=1.5">
  <title>扫雷 · 经典版</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(135deg, #2b3a2b 0%, #1e2b1e 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Noto Sans', system-ui, sans-serif;
      padding: 20px;
      margin: 0;
    }
    .game-wrapper {
      background: #4a5b4a;
      background-image: radial-gradient(circle at 30% 30%, #6b7d6b, #3a4a3a);
      border-radius: 48px;
      box-shadow: 0 25px 40px rgba(0, 0, 0, 0.7), inset 0 2px 10px rgba(255, 255, 200, 0.5);
      padding: 24px 28px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 2px solid #9bb09b;
    }
    h1 {
      color: #e9f0d9;
      text-shadow: 3px 3px 0 #1e2e1e, 2px 2px 10px #00000050;
      font-size: 2.8rem;
      letter-spacing: 4px;
      margin-bottom: 15px;
      font-weight: 700;
      text-align: center;
      word-break: break-word;
    }
    .info-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      background: #2f3d2f;
      border-radius: 50px;
      padding: 10px 22px;
      box-shadow: inset 0 3px 8px rgba(0,0,0,0.6), 0 6px 12px rgba(0,0,0,0.5);
      color: #f2e7c9;
      font-weight: bold;
      gap: 20px;
      flex-wrap: wrap;
    }
    .mines-counter, .timer {
      background: #1e2a1a;
      padding: 6px 18px;
      border-radius: 30px;
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: inset 0 1px 5px black;
    }
    .reset-btn {
      background: #c9a23b;
      border: none;
      color: #1e2e1e;
      font-weight: bold;
      font-size: 1.5rem;
      width: 48px;
      height: 48px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 5px 0 #6b4f1c, 0 6px 12px black;
      transition: 0.08s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: linear-gradient(to bottom, #efcd6b, #b58b2a);
      border: 1px solid #ffea9c;
      line-height: 1;
    }
    .reset-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #5a3f16, 0 6px 10px black;
    }
    canvas {
      display: block;
      margin: 0 auto;
      border-radius: 28px;
      background: #7d917d;
      box-shadow: inset 0 0 0 5px #2f392f, 0 18px 28px rgba(0,0,0,0.8);
      touch-action: none;  /* 禁止触摸时页面滑动 */
      width: 100%;
      height: auto;
      max-width: 400px;
    }
    .status-text {
      margin-top: 16px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #fae56b;
      background: #2d3920;
      padding: 5px 28px;
      border-radius: 30px;
      letter-spacing: 1px;
    }
    @media (max-width: 450px) {
      .game-wrapper {
        padding: 16px 16px 24px;
      }
      .info-bar {
        padding: 8px 16px;
      }
    }
  </style>
</head>
<body>
<div class="game-wrapper">
  <h1>💣 扫 雷</h1>
  <div class="info-bar">
    <div class="mines-counter">
      <span>💥</span> <span id="mineDisplay">10</span>
    </div>
    <button class="reset-btn" id="resetButton">↺</button>
    <div class="timer">
      <span>⏱️</span> <span id="timerDisplay">0</span>
    </div>
  </div>
  <canvas id="mineCanvas" width="360" height="360" aria-label="扫雷网格，左键揭开，右键/长按标记旗帜"></canvas>
  <div class="status-text" id="statusMessage"></div>
  <div style="color: #ccd7b5; margin-top: 10px; font-size: 0.9rem;">🖱️ 左键揭开 | 🚩 右键/长按插旗</div>
</div>

<script>
  (function() {
    // ---------- 游戏配置 ----------
    const ROWS = 9;
    const COLS = 9;
    const TOTAL_MINES = 10;
    
    // 游戏状态
    let board = [];                 // 二维数组: 每个单元格 { mine, revealed, flagged, adjacentMines }
    let gameOver = false;
    let gameWin = false;
    let minesCount = TOTAL_MINES;
    let flagsPlaced = 0;
    let timer = 0;
    let timerInterval = null;
    let firstMoveDone = false;     // 首次点击后才布雷，保证安全
    
    // DOM 元素
    const canvas = document.getElementById('mineCanvas');
    const ctx = canvas.getContext('2d');
    const mineDisplaySpan = document.getElementById('mineDisplay');
    const timerDisplaySpan = document.getElementById('timerDisplay');
    const statusDiv = document.getElementById('statusMessage');
    
    const CELL_SIZE = 40; // 360/9 = 40px
    
    // ---------- 初始化空白板 ----------
    function createEmptyBoard() {
      return Array(ROWS).fill().map(() => Array(COLS).fill().map(() => ({
        mine: false,
        revealed: false,
        flagged: false,
        adjacentMines: 0
      })));
    }
    
    function resetGame() {
      // 停止计时器
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      board = createEmptyBoard();
      gameOver = false;
      gameWin = false;
      firstMoveDone = false;
      flagsPlaced = 0;
      timer = 0;
      updateMineDisplay();
      timerDisplaySpan.textContent = '0';
      statusDiv.textContent = '';
      drawBoard();
    }
    
    // 随机布雷 (避开第一个点击位置 firstRow, firstCol)
    function placeMines(excludeRow, excludeCol) {
      // 先清空地雷
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          board[r][c].mine = false;
        }
      }
      
      let minesToPlace = TOTAL_MINES;
      const maxAttempts = 1000;
      let attempts = 0;
      
      while (minesToPlace > 0 && attempts < maxAttempts) {
        const randRow = Math.floor(Math.random() * ROWS);
        const randCol = Math.floor(Math.random() * COLS);
        
        // 不能是排除格及其周围8格（保证第一次点击安全且打开一片）
        if (Math.abs(randRow - excludeRow) <= 1 && Math.abs(randCol - excludeCol) <= 1) {
          attempts++;
          continue;
        }
        
        if (!board[randRow][randCol].mine) {
          board[randRow][randCol].mine = true;
          minesToPlace--;
        }
        attempts++;
      }
      
      // 如果因为某些原因没放满(极小概率)，补充放置，但避免安全区
      if (minesToPlace > 0) {
        for (let r = 0; r < ROWS && minesToPlace > 0; r++) {
          for (let c = 0; c < COLS && minesToPlace > 0; c++) {
            if (!board[r][c].mine && !(Math.abs(r - excludeRow) <= 1 && Math.abs(c - excludeCol) <= 1)) {
              board[r][c].mine = true;
              minesToPlace--;
            }
          }
        }
      }
      
      // 计算相邻地雷数
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (board[r][c].mine) {
            board[r][c].adjacentMines = 0;
            continue;
          }
          let count = 0;
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              if (dr === 0 && dc === 0) continue;
              const nr = r + dr, nc = c + dc;
              if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc].mine) {
                count++;
              }
            }
          }
          board[r][c].adjacentMines = count;
        }
      }
    }
    
    // 揭开格子 (递归展开)
    function revealCell(row, col) {
      if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return;
      const cell = board[row][col];
      if (cell.revealed || cell.flagged || gameOver || gameWin) return;
      
      // 如果是地雷，触发游戏结束
      if (cell.mine) {
        cell.revealed = true; // 显示出爆炸的雷
        gameOver = true;
        revealAllMines();
        stopTimer();
        statusDiv.textContent = '💥 踩到雷了！游戏结束';
        drawBoard();
        return;
      }
      
      // 揭开当前格
      cell.revealed = true;
      
      // 如果相邻雷数为0，递归展开周围格子
      if (cell.adjacentMines === 0) {
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            revealCell(row + dr, col + dc);
          }
        }
      }
      
      // 检查胜利条件
      checkVictory();
    }
    
    // 检查是否胜利：所有非雷格子都被揭开
    function checkVictory() {
      if (gameOver || gameWin) return;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = board[r][c];
          if (!cell.mine && !cell.revealed) {
            return; // 还有未揭开的非雷格
          }
        }
      }
      // 胜利！
      gameWin = true;
      gameOver = true; // 禁止进一步操作
      stopTimer();
      // 自动标记所有未标记的地雷为旗帜（美观）
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (board[r][c].mine && !board[r][c].flagged) {
            board[r][c].flagged = true;
          }
        }
      }
      flagsPlaced = TOTAL_MINES;
      updateMineDisplay();
      statusDiv.textContent = '🏆 你赢了！太棒了！';
      drawBoard();
    }
    
    // 游戏结束时显示所有地雷
    function revealAllMines() {
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (board[r][c].mine) {
            board[r][c].revealed = true;
          }
        }
      }
    }
    
    // 切换旗帜
    function toggleFlag(row, col) {
      if (gameOver || gameWin) return;
      const cell = board[row][col];
      if (cell.revealed) return;
      
      if (cell.flagged) {
        cell.flagged = false;
        flagsPlaced--;
      } else {
        // 不能超过总雷数限制（但允许标记超过？经典规则通常不限制，但显示剩余雷数）
        cell.flagged = true;
        flagsPlaced++;
      }
      updateMineDisplay();
      drawBoard();
      
      // 标记后也可检查胜利（如果所有雷都被正确标记且无非雷标记，但标准胜利通常要求揭开所有非雷格）
      // 这里仍以揭开为准，不提前胜利。
    }
    
    function updateMineDisplay() {
      const remaining = TOTAL_MINES - flagsPlaced;
      mineDisplaySpan.textContent = remaining >= 0 ? remaining : 0;
    }
    
    // 计时器控制
    function startTimer() {
      if (timerInterval) return;
      timerInterval = setInterval(() => {
        timer++;
        timerDisplaySpan.textContent = timer;
      }, 1000);
    }
    
    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }
    
    // ---------- 绘制画布 ----------
    function drawBoard() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const x = c * CELL_SIZE, y = r * CELL_SIZE;
          const cell = board[r][c];
          
          // 背景色
          if (cell.revealed) {
            ctx.fillStyle = '#cdc5a7';
          } else {
            ctx.fillStyle = '#8b9b7c';
          }
          ctx.fillRect(x, y, CELL_SIZE-1, CELL_SIZE-1);
          
          // 边框立体感
          ctx.strokeStyle = '#4a5a3a';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(x, y, CELL_SIZE, CELL_SIZE);
          
          if (!cell.revealed) {
            // 未揭开：凸起效果
            ctx.fillStyle = '#b2c292';
            ctx.fillRect(x+2, y+2, CELL_SIZE-5, CELL_SIZE-5);
            ctx.fillStyle = '#dce3c0';
            ctx.fillRect(x+1, y+1, CELL_SIZE-4, CELL_SIZE-4);
            
            // 旗帜
            if (cell.flagged) {
              ctx.font = 'bold 26px "Segoe UI", "Noto Sans"';
              ctx.fillStyle = '#c92a2a';
              ctx.shadowColor = '#400000';
              ctx.shadowBlur = 5;
              ctx.fillText('🚩', x + 6, y + 32);
              ctx.shadowColor = 'transparent';
              ctx.shadowBlur = 0;
            }
          } else {
            // 已揭开
            if (cell.mine) {
              ctx.font = 'bold 28px "Segoe UI"';
              ctx.fillStyle = '#1e1e1e';
              ctx.fillText('💣', x + 5, y + 32);
            } else {
              const count = cell.adjacentMines;
              if (count > 0) {
                ctx.font = 'bold 22px "Segoe UI", "Arial"';
                // 数字颜色
                const colors = ['', '#1a4dc9', '#2e6b2e', '#c92a2a', '#2b2b7a', '#6b2b2b', '#2f5f5f', '#4a1a4a', '#5a4a2a'];
                ctx.fillStyle = colors[count] || '#1e1e1e';
                ctx.fillText(count.toString(), x + 13, y + 28);
              }
            }
          }
        }
      }
      
      // 游戏结束覆盖层
      if (gameOver && !gameWin) {
        ctx.globalAlpha = 0.3;
        ctx.fillStyle = '#330000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.globalAlpha = 1;
      } else if (gameWin) {
        ctx.globalAlpha = 0.25;
        ctx.fillStyle = '#e7c45e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.globalAlpha = 1;
      }
    }
    
    // ---------- 坐标转换 ----------
    function getCellFromEvent(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      
      let clientX, clientY;
      if (e.touches) {
        if (e.touches.length === 0) return null;
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
        e.preventDefault();
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }
      
      const canvasX = (clientX - rect.left) * scaleX;
      const canvasY = (clientY - rect.top) * scaleY;
      const col = Math.floor(canvasX / CELL_SIZE);
      const row = Math.floor(canvasY / CELL_SIZE);
      
      if (row >= 0 && row < ROWS && col >= 0 && col < COLS) {
        return { row, col };
      }
      return null;
    }
    
    // 处理左键点击 (揭开)
    function handleLeftClick(row, col) {
      if (gameOver || gameWin) return;
      const cell = board[row][col];
      if (cell.flagged || cell.revealed) return;
      
      // 首次移动：布雷并开始计时
      if (!firstMoveDone) {
        firstMoveDone = true;
        placeMines(row, col);
        startTimer();
      }
      
      revealCell(row, col);
      drawBoard();
    }
    
    // 处理右键/长按 (标记旗帜)
    function handleRightClick(row, col) {
      if (gameOver || gameWin) return;
      if (!firstMoveDone) {
        // 不允许在首次点击前插旗，但可以先布雷？设计为不能插旗，提示或忽略。
        return;
      }
      toggleFlag(row, col);
    }
    
    // 事件绑定
    canvas.addEventListener('click', (e) => {
      const pos = getCellFromEvent(e);
      if (!pos) return;
      handleLeftClick(pos.row, pos.col);
    });
    
    canvas.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      const pos = getCellFromEvent(e);
      if (!pos) return;
      handleRightClick(pos.row, pos.col);
    });
    
    // 移动端长按模拟右键 (700ms)
    let pressTimer = null;
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const pos = getCellFromEvent(e);
      if (!pos) return;
      
      // 设置长按定时器
      pressTimer = setTimeout(() => {
        handleRightClick(pos.row, pos.col);
        pressTimer = null;
      }, 600);
    });
    
    canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      if (pressTimer) {
        clearTimeout(pressTimer);
        // 短按视为左键
        const pos = getCellFromEvent(e);
        if (pos) {
          handleLeftClick(pos.row, pos.col);
        }
        pressTimer = null;
      }
    });
    
    canvas.addEventListener('touchmove', (e) => {
      // 移动取消长按
      if (pressTimer) {
        clearTimeout(pressTimer);
        pressTimer = null;
      }
    });
    
    document.getElementById('resetButton').addEventListener('click', resetGame);
    
    // 启动游戏
    resetGame();
  })();
</script>
</body>
</html>
